# Lint, content, unit, server and end-to-end checks. Applying migrations and deploying are not wired yet.
name: ci

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

jobs:
    checks:
        runs-on: ubuntu-latest
        timeout-minutes: 45
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.14
            - run: bun install --frozen-lockfile
            - name: Lint and type check
              run: |
                  bun run lint
                  bun run check
            - name: Content
              run: bun run content:check
            - name: Unit and property
              run: bun test tests
            - name: Install PostgreSQL 17 client and age (backup checks)
              run: |
                  sudo install -d /usr/share/postgresql-common/pgdg
                  sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
                  echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
                  sudo apt-get update
                  sudo apt-get install -y postgresql-client-17 age
                  echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
            - uses: supabase/setup-cli@v1
              with:
                  version: latest
            - name: Server integration and pgTAP
              run: |
                  bun run db:start
                  bun run db:test
            - name: End to end
              run: |
                  bunx playwright install --with-deps chromium webkit
                  bun run e2e
            - uses: actions/upload-artifact@v4
              if: failure()
              with:
                  name: playwright-traces
                  path: test-results/
                  retention-days: 7
